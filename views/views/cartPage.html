<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <header class="bg-white border-bottom py-3 shadow-sm">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center gap-3">
                <h4 class="mb-0">
                    <a href="index.html" class="text-decoration-none text-dark">MyApp</a>
                </h4>
                <div class="flex-grow-1 mx-4">
                    <input type="search" class="form-control" placeholder="Search books...">
                </div>
                <div class="d-flex gap-3">
                    <a href="cartPage.html" class="text-decoration-none text-dark">Cart</a>
                    <a href="profileUser.html" class="text-decoration-none text-dark">User</a>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow-1 py-4">
        <div class="container">
            <div class="row g-4">
                <!-- Left Side - Cart Items -->
                <div class="col-lg-8">
                    <div class="card border-0 shadow rounded-4 mb-4">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div>
                                    <h3 class="mb-1 fw-bold">My Cart</h3>
                                    <p class="text-muted mb-0 small">2 items in your cart</p>
                                </div>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="" id="selectAll">
                                        <label class="form-check-label small" for="selectAll">
                                            Select All
                                        </label>
                                    </div>
                                    <button class="btn btn-danger btn-sm px-3" type="button">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-trash-fill me-1" viewBox="0 0 16 16">
                                            <path d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1H3v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4h.5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1H2.5zm3 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5zM8 5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7A.5.5 0 0 1 8 5zm3 .5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 1 0z"/>
                                        </svg>
                                        Delete
                                    </button>
                                </div>
                            </div>

                            <hr class="my-4">
                            
                            <!-- Cart Items -->
                            <div id="cartItems">
                                <!-- Book Item 1 -->
                                <div class="cart-item mb-3" data-price="150000">
                                    <div class="d-flex gap-3 p-3 bg-light rounded-3 align-items-center">
                                        <!-- Checkbox -->
                                        <div class="flex-shrink-0">
                                            <input class="form-check-input" type="checkbox" value="" id="selectBook1" style="width: 20px; height: 20px;">
                                        </div>

                                        <!-- Book Image -->
                                        <div class="flex-shrink-0">
                                            <div class="bg-secondary rounded-3 d-flex align-items-center justify-content-center shadow-sm" style="width: 80px; height: 110px;">
                                                <span class="text-white text-center small">Cover</span>
                                            </div>
                                        </div>
                                        
                                        <!-- Book Details -->
                                        <div class="flex-grow-1">
                                            <h5 class="mb-1 fw-bold">The Great Gatsby</h5>
                                            <p class="text-muted mb-2 small">by F. Scott Fitzgerald</p>
                                            <p class="fw-bold text-primary mb-0 fs-5">IDR 150,000</p>
                                        </div>

                                        <!-- Delete Button -->
                                        <div class="flex-shrink-0">
                                            <button class="btn btn-danger" type="button" style="width: 36px; height: 36px; padding: 0;">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash-fill" viewBox="0 0 16 16">
                                                    <path d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1H3v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4h.5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1H2.5zm3 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5zM8 5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7A.5.5 0 0 1 8 5zm3 .5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 1 0z"/>
                                                </svg>
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <!-- Book Item 2 -->
                                <div class="cart-item mb-3" data-price="175000">
                                    <div class="d-flex gap-3 p-3 bg-light rounded-3 align-items-center">
                                        <!-- Checkbox -->
                                        <div class="flex-shrink-0">
                                            <input class="form-check-input" type="checkbox" value="" id="selectBook2" style="width: 20px; height: 20px;">
                                        </div>

                                        <!-- Book Image -->
                                        <div class="flex-shrink-0">
                                            <div class="bg-secondary rounded-3 d-flex align-items-center justify-content-center shadow-sm" style="width: 80px; height: 110px;">
                                                <span class="text-white text-center small">Cover</span>
                                            </div>
                                        </div>
                                        
                                        <!-- Book Details -->
                                        <div class="flex-grow-1">
                                            <h5 class="mb-1 fw-bold">To Kill a Mockingbird</h5>
                                            <p class="text-muted mb-2 small">by Harper Lee</p>
                                            <p class="fw-bold text-primary mb-0 fs-5">IDR 175,000</p>
                                        </div>

                                        <!-- Delete Button -->
                                        <div class="flex-shrink-0">
                                            <button class="btn btn-danger" type="button" style="width: 36px; height: 36px; padding: 0;">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash-fill" viewBox="0 0 16 16">
                                                    <path d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1H3v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4h.5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1H2.5zm3 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5zM8 5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7A.5.5 0 0 1 8 5zm3 .5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 1 0z"/>
                                                </svg>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                                <!-- Right Side - Order Summary -->
                <div class="col-lg-4">
                    <div class="card border-0 shadow rounded-4 position-sticky" style="top: 20px;">
                        <div class="card-body p-4">
                            <h4 class="fw-bold mb-4">Cart Summary</h4>
                            
                            <div class="mb-3">
                                <div class="d-flex justify-content-between mb-3">
                                    <span class="text-muted">Items</span>
                                    <span class="fw-semibold">2 items</span>
                                </div>
                            </div>

                            <hr class="my-3">

                            <div class="d-flex justify-content-between">
                                <h5 class="fw-bold mb-0">Total</h5>
                                <h5 class="fw-bold mb-0 text-primary">IDR 325,000</h5>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
        
    <footer class="bg-white border-top py-3 mt-auto">
        <div class="container-fluid">
            <p class="text-center mb-0 text-muted">MyApp © 2025</p>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
